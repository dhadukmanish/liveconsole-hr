name: Deploy to site4now

# Deployment runs on GitHub's runners because they have open outbound FTP.
# A build sandbox usually does not, which is the whole reason this exists.
#
# Triggers:
#   - a push whose commit SUBJECT (first line) contains [deploy]
#   - the "Run workflow" button, once this file is on the default branch
#
# Only the subject line counts. Writing about [deploy] in a commit body must not
# ship anything — that mistake already happened once.
#
# Add [seed] to the commit message as well to create the roles, permissions,
# masters and the first SUPERADMIN. Seeding is idempotent, but it is opt-in so
# an ordinary deploy never touches account data.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Apply database migrations"
        type: boolean
        default: true
      run_seed:
        description: "Seed roles, permissions, masters and the super admin"
        type: boolean
        default: false

concurrency:
  # Never let two deploys write to the same FTP account at once.
  group: deploy-site4now
  cancel-in-progress: false

jobs:
  gate:
    # Decides whether this push is asking to ship. Split out because a job-level
    # `if` can only see the whole commit message, body included, and prose that
    # merely mentions the marker must not deploy.
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      seed: ${{ steps.decide.outputs.seed }}
      inspect: ${{ steps.decide.outputs.inspect }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SEED: ${{ inputs.run_seed }}
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "commit subject: $subject"

          deploy=false
          seed=false
          inspect=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy=true
            [ "$DISPATCH_SEED" = "true" ] && seed=true
          else
            case "$subject" in *"[deploy]"*) deploy=true ;; esac
            case "$subject" in *"[seed]"*) seed=true ;; esac
            case "$subject" in *"[inspect]"*) inspect=true ;; esac
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "inspect=$inspect" >> "$GITHUB_OUTPUT"
          echo "decision: deploy=$deploy seed=$seed inspect=$inspect"

  inspect:
    # Thirty seconds instead of a fifteen-minute deploy, for answering "where did
    # the files land and what does the site actually return?"
    needs: gate
    if: needs.gate.outputs.inspect == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Remote folder listing
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ vars.FTP_REMOTE || '/' }}
        run: node scripts/ftp-deploy.mjs --list

      - name: App logs from the host
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ vars.FTP_REMOTE || '/' }}
        run: node scripts/ftp-deploy.mjs --logs

      - name: What does the site return, over both http and https
        env:
          HOST_NAME: ${{ vars.SITE_HOST || 'task.kriviinfotech.com' }}
        run: |
          # No -e here: a failing curl is a result to report, not a reason to
          # stop before printing the diagnosis.
          set +e

          for url in "http://$HOST_NAME/login" "https://$HOST_NAME/login"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "$url -> curl exit $rc: $(curl -sS -o /dev/null --max-time 30 "$url" 2>&1 | head -1)"
            else
              echo "$url -> HTTP $code"
            fi
          done

          echo
          echo "=== headers: http://$HOST_NAME/login ==="
          curl -sS -I --max-time 30 "http://$HOST_NAME/login" 2>&1 | head -15

          echo
          echo "=== body: http://$HOST_NAME/login ==="
          # IIS puts the sub-status (500.19 and friends) in the page body, which
          # is the difference between "module missing" and "app crashed".
          curl -sS --max-time 30 "http://$HOST_NAME/login" 2>&1 \
            | sed -e 's/<[^>]*>/ /g' -e 's/  */ /g' \
            | grep -v '^ *$' | head -30

          echo
          echo "(exit code is forced to 0: this step reports, it does not judge)"
          exit 0

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the required secrets exist
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          missing=""
          for name in FTP_HOST FTP_USER FTP_PASSWORD DATABASE_URL AUTH_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Build the upload payload
        env:
          # Prisma needs a URL at generate time; the build itself renders every
          # page on demand, so it does not query the database.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          # Baked in at build time, so it has to be set here rather than in .env.
          NEXT_PUBLIC_BETA_BANNER: ${{ vars.BETA_BANNER || 'true' }}
        run: npm run package

      - name: Write the .env that ships with the payload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SESSION_COOKIE_SECURE: ${{ vars.SESSION_COOKIE_SECURE || 'false' }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER || 'console' }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_SENDER_ID: ${{ secrets.MSG91_SENDER_ID }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
        run: |
          # Written with printf from the environment so no secret is ever echoed
          # into the log. GitHub masks secrets, but not printing them is better.
          {
            printf 'DATABASE_URL="%s"\n' "$DATABASE_URL"
            printf 'DIRECT_DATABASE_URL="%s"\n' "$DIRECT_DATABASE_URL"
            printf 'AUTH_SECRET="%s"\n' "$AUTH_SECRET"
            printf 'UPLOAD_DIR="./App_Data/uploads"\n'
            printf 'SESSION_COOKIE_SECURE="%s"\n' "$SESSION_COOKIE_SECURE"
            printf 'SMS_PROVIDER="%s"\n' "$SMS_PROVIDER"
            printf 'MSG91_AUTH_KEY="%s"\n' "$MSG91_AUTH_KEY"
            printf 'MSG91_SENDER_ID="%s"\n' "$MSG91_SENDER_ID"
            printf 'MSG91_TEMPLATE_ID="%s"\n' "$MSG91_TEMPLATE_ID"
          } > deploy-payload/.env
          chmod 600 deploy-payload/.env
          echo "Wrote deploy-payload/.env ($(wc -l < deploy-payload/.env) lines)"

      - name: Apply database migrations
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.run_migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          POOLED_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e

          # Preferred: the direct connection. Some hosts, this one included,
          # only expose the pooler to the outside world, so this can fail with
          # P1001 even though the credentials are perfectly good.
          if [ -n "$DIRECT_URL" ]; then
            echo "Trying the direct connection..."
            DATABASE_URL="$DIRECT_URL" DIRECT_DATABASE_URL="$DIRECT_URL" \
              npx prisma migrate deploy
            if [ $? -eq 0 ]; then
              echo "Migrations applied over the direct connection."
              echo "DB_ROUTE=direct" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::warning::Direct connection unavailable; falling back to the pooler."
          fi

          # Fallback: through PgBouncer. Prisma normally takes a Postgres
          # advisory lock around a migration, which a transaction-mode pooler
          # cannot hold across statements. The deploy concurrency group already
          # serialises runs, so dropping the lock is safe here.
          export PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=true
          DATABASE_URL="$POOLED_URL" DIRECT_DATABASE_URL="$POOLED_URL" \
            npx prisma migrate deploy
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::Migrations failed over both the direct connection and the pooler."
            echo "Next step is applying prisma/migrations/*/migration.sql by hand in the panel's query tool."
            exit $status
          fi
          echo "Migrations applied through the pooler."
          echo "DB_ROUTE=pooled" >> "$GITHUB_ENV"

      - name: Seed roles, permissions, masters and the super admin
        if: needs.gate.outputs.seed == 'true'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          POOLED_URL: ${{ secrets.DATABASE_URL }}
          SUPERADMIN_MOBILE: ${{ vars.SUPERADMIN_MOBILE }}
          SUPERADMIN_NAME: ${{ vars.SUPERADMIN_NAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
        run: |
          # Use whichever route the migration step proved reachable.
          if [ "$DB_ROUTE" = "pooled" ] || [ -z "$DIRECT_URL" ]; then
            export DATABASE_URL="$POOLED_URL"
          else
            export DATABASE_URL="$DIRECT_URL"
          fi
          export DIRECT_DATABASE_URL="$DATABASE_URL"
          npm run db:seed
          echo "::notice::If a super admin was created, its password is in the step log above. Change it at first sign-in."

      - name: Show the remote folder before uploading
        # On a first deploy this is how we learn where the site actually lives.
        # If the app should go somewhere other than the FTP root, set the
        # FTP_REMOTE repository variable to that path.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ vars.FTP_REMOTE || '/' }}
        run: node scripts/ftp-deploy.mjs --list

      - name: Upload over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE: ${{ vars.FTP_REMOTE || '/' }}
        # The host's placeholder index.html is served ahead of the app, and this
        # deploy never produces an index.html of its own.
        run: node scripts/ftp-deploy.mjs --remove-default-index

      - name: Check the site answers
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://task.kriviinfotech.com' }}
        run: |
          echo "Giving IIS a moment to start the Node process..."
          sleep 25

          host=$(echo "$SITE_URL" | sed -E 's#^https?://##; s#/.*##')

          for attempt in 1 2 3 4 5 6; do
            # Try HTTPS and plain HTTP: the subdomain may not have a certificate
            # yet, and "no answer at all" reads very differently from "404".
            for url in "https://$host/login" "http://$host/login"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$url")
              if [ -z "$code" ]; then code="no-response"; fi
              echo "attempt $attempt: $url -> $code"
              if [ "$code" = "200" ]; then
                echo "::notice::Site is up: $url"
                exit 0
              fi
            done
            sleep 20
          done

          echo "::warning::The site is not serving the app yet."
          echo "  404 means IIS is serving the folder but not handing requests to Node:"
          echo "  enable Node.js for this site in the control panel, or switch web.config"
          echo "  to the iisnode block."
          echo "  No response at all over https usually means the subdomain has no"
          echo "  certificate yet."
